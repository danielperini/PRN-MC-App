services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_BASE44_APP_ID: "6a11dbeecf8f7a5977ffc750"
        VITE_BASE44_APP_BASE_URL: "https://appgestor.periniprojetos.com.br"
    container_name: gestor-museus-web
    restart: unless-stopped
    ports:
      - "8081:80"
    depends_on:
      api:
        condition: service_started

  db:
    image: postgres:16-alpine
    container_name: appgestor-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - appgestor_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  migrate:
    image: postgres:16-alpine
    container_name: appgestor-migrate
    restart: "no"
    environment:
      PGHOST: db
      PGPORT: 5432
      PGDATABASE: ${POSTGRES_DB}
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./migration/sql/004_finalize_relationships.sql:/migrations/004_finalize_relationships.sql:ro
    depends_on:
      db:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-ec"]
    command: "psql -v ON_ERROR_STOP=1 -f /migrations/004_finalize_relationships.sql"

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: appgestor-api
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PORT: 3000
      UPLOAD_DIR: /app/uploads
      PUBLIC_BASE_URL: https://appgestor.periniprojetos.com.br
      MAX_UPLOAD_MB: 100
    volumes:
      - appgestor_uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:3001:3000"

volumes:
  appgestor_pgdata:
  appgestor_uploads:
