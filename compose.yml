services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_BASE44_APP_ID: "6a11dbeecf8f7a5977ffc750"
        VITE_BASE44_APP_BASE_URL: "https://periniprojetos.com.br"
    container_name: gestor-museus-web
    restart: unless-stopped
    ports:
      - "8081:80"

  db:
    image: postgres:16-alpine
    container_name: appgestor-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - appgestor_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5


  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: appgestor-api
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PORT: 3000
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:3001:3000"

volumes:
  appgestor_pgdata:
