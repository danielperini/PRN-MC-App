name: Patch metas do 3 aditivo

on:
  push:
    paths:
      - '.github/workflows/patch-metas-3-aditivo.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-metas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Atualizar lista de metas no modal de NF
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path('src/components/entrada/CoordReviewModalNF.jsx')
          text = path.read_text(encoding='utf-8')

          new_block = """const METAS_3_ADITIVO = [
  { id: 'MC3A-01', nome: 'Meta 1 (mês 1-28): Gestão, coordenação e equipe principal do projeto' },
  { id: 'MC3A-02', nome: 'Meta 2 (mês 1-28): Plano de comunicação, assessoria de imprensa e marketing cultural' },
  { id: 'MC3A-03', nome: 'Meta 3 (mês 2-28): Manutenção, operação e conservação das exposições' },
  { id: 'MC3A-04', nome: 'Meta 4 (mês 6-15): Alteração, atualização e qualificação de núcleos expositivos' },
  { id: 'MC3A-05', nome: 'Meta 5 (mês 2-18): Ações educativas, formação de público e atividades de mediação' },
  { id: 'MC3A-06', nome: 'Meta 6 (mês 2-18): Ações culturais, programação pública e difusão cultural' },
  { id: 'MC3A-07', nome: 'Meta 7 (mês 1-28): Educadores, equipe de atendimento e operação educativa' },
  { id: 'MC3A-08', nome: 'Meta 8 (mês 1-18): Exposição e publicação MHAB / Casarão' },
  { id: 'MC3A-09', nome: 'Meta 9: Mostras, exposições temporárias e peças em destaque' },
  { id: 'MC3A-10', nome: 'Meta 10: Noturno nos Museus 2026 — produção, infraestrutura e programação' },
  { id: 'MC3A-11', nome: 'Meta 11: Diárias, viagens, publicações, tradução, revisão e impressão' },
  { id: 'MC3A-12', nome: 'Meta 12: Alimentação, lanches, materiais e ações educativo-culturais' },
  { id: 'MC3A-13', nome: 'Meta 13: Consultorias, formação, ambiente seguro, diversidade e inclusão' },
  { id: 'MC3A-CUSTOS-GERAIS', nome: 'Meta Custos Gerais: despesas gerais, transporte, escritório, contador, energia e jurídico' },
];"""

          pattern = r"const METAS_3_ADITIVO = \[[\s\S]*?\];"
          updated, count = re.subn(pattern, new_block, text, count=1)
          if count != 1:
            raise SystemExit('Bloco METAS_3_ADITIVO não encontrado ou encontrado múltiplas vezes')

          path.write_text(updated, encoding='utf-8')
          PY

      - name: Commit patch
        run: |
          if git diff --quiet; then
            echo "Sem alterações"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/components/entrada/CoordReviewModalNF.jsx
          git commit -m "feat: expandir metas do terceiro aditivo"
          git push
