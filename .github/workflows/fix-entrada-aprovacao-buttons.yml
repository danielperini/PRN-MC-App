name: Fix Entrada Unica approval buttons
on:
  push:
    branches: [main]
    paths: ['.github/workflows/fix-entrada-aprovacao-buttons.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Patch Entrada Unica approval flow
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          p=Path('src/components/entrada/DocumentIntakeCard.jsx')
          s=p.read_text()

          replacements=[]

          old="""  const hasError = intake.status_processamento === 'ERRO_PROCESSAMENTO';
  const canReanalisar = hasError || canFallbackReview || isEnviadoTravado;
  const canSendApproval = canReview && isPDF && !isProcessing;
"""
          new="""  const hasError = intake.status_processamento === 'ERRO_PROCESSAMENTO';
  // Reanálise deve estar disponível também quando a IA terminou incompleta e
  // colocou o documento em AGUARDANDO_REVISAO.
  const canReanalisar = !!onReanalyse && isPDF && [
    'ERRO_PROCESSAMENTO', 'AGUARDANDO_REVISAO', 'ANALISANDO_IA', 'ENVIADO'
  ].includes(statusKey);
  // Aprovação manual é uma ação explícita da tela após conferência humana.
  const canSendApproval = isPDF && ['AGUARDANDO_REVISAO', 'RASCUNHO'].includes(statusKey);
"""
          if old not in s: raise SystemExit('threshold block not found')
          s=s.replace(old,new,1)

          old="""    const valor = parseValorBR(ia.nf_valor_total || ia.valor || ia.valor_total || 0);

    if (!rubrica_id || !centro_custo || !valor) {
"""
          new="""    const valor = parseValorBR(ia.nf_valor_total || ia.valor || ia.valor_total || 0);

    // A data de emissão é obrigatória. Primeiro usa o PDF/IA; se estiver vazia,
    // tenta o XML já vinculado. Nunca inventa uma data.
    let nfData = getNFDateIntake(intake);
    if (!nfData && intake.nf_xml_intake_id) {
      const xmlIntake = await base44.entities.DocumentIntake.get(intake.nf_xml_intake_id).catch(() => null);
      const xmlIa = xmlIntake?.resultado_ia || {};
      nfData = getNFDateIntake(xmlIntake) || String(
        xmlIa.dhEmi || xmlIa.dEmi || xmlIa.dataEmissao || xmlIa.data_emissao_nf || ''
      ).trim();
      if (nfData) {
        await base44.entities.DocumentIntake.update(intake.id, {
          nf_data_emissao: nfData,
          resultado_ia: { ...ia, nf_data_emissao: nfData }
        }).catch(() => null);
      }
    }

    if (!nfData) {
      toast.error('Aprovação bloqueada: a data de emissão da NF não foi identificada. Clique em "Revisar" e informe a data.');
      if (onReview) onReview({ ...intake, resultado_ia: ia });
      return;
    }

    if (!rubrica_id || !centro_custo || !valor) {
"""
          if old not in s: raise SystemExit('approval preamble not found')
          s=s.replace(old,new,1)

          old="""    setSendingApproval(true);
    try {
      const rubrica = await base44.entities.Rubrica.get(rubrica_id).catch(() => null);
"""
          new="""    setSendingApproval(true);
    try {
      // Idempotência: um intake já convertido não pode criar uma segunda compra.
      const existing = await base44.entities.PurchaseRequest.filter({ intake_id: intake.id }, '-created_date', 1).catch(() => []);
      if (existing?.[0]?.id) {
        await base44.entities.DocumentIntake.update(intake.id, {
          status_processamento: 'ENVIADO_APROVACAO',
          ocultar_entrada_unica: true,
          entidade_destino: 'PurchaseRequest',
          entidade_destino_id: existing[0].id,
        }).catch(() => null);
        toast.success('Esta NF já está em Compras. O vínculo foi restaurado.');
        if (onSentToApproval) onSentToApproval(intake.id);
        return;
      }

      const rubrica = await base44.entities.Rubrica.get(rubrica_id).catch(() => null);
"""
          if old not in s: raise SystemExit('approval try block not found')
          s=s.replace(old,new,1)

          s=s.replace("nf_data_emissao: ia.nf_data_emissao || ia.data_emissao || ''", "nf_data_emissao: nfData", 2)

          old="""          {/* PDF: o envio para coordenação agora é feito automaticamente pelo
              pipeline \"Reprocessar Fila\" (admin). Nenhum botão de envio manual. */}
"""
          new="""          {/* PDF: aprovação explícita para Compras após revisão humana. */}
          {canSendApproval &&
            <Button size=\"sm\" onClick={handleSendToApproval}
              disabled={sendingApproval || loading || prDuplicatas.length > 0}
              className=\"h-8 text-xs px-3 bg-emerald-600 hover:bg-emerald-700 text-white\"
              title={prDuplicatas.length > 0 ? 'Verifique a possível duplicata antes de aprovar' : 'Aprovar e enviar para Compras'}>
              {sendingApproval ? <Loader2 className=\"w-3 h-3 animate-spin mr-1\" /> : <CheckCircle2 className=\"w-3 h-3 mr-1\" />}
              {sendingApproval ? 'Aprovando...' : 'Aprovar para Compras'}
            </Button>
          }
"""
          if old not in s: raise SystemExit('removed manual button comment not found')
          s=s.replace(old,new,1)

          # O caminho de confirmação "sem XML" também precisa exigir data antes
          # de criar a PurchaseRequest.
          old="""                  const valor2 = parseValorBR(ia2.nf_valor_total || ia2.valor || ia2.valor_total || 0);
                  const fileName2 = intake.file_name_final || intake.file_name_original || 'Arquivo';
"""
          new="""                  const valor2 = parseValorBR(ia2.nf_valor_total || ia2.valor || ia2.valor_total || 0);
                  let nfData2 = getNFDateIntake(intake);
                  if (!nfData2 && intake.nf_xml_intake_id) {
                    const xml2 = await base44.entities.DocumentIntake.get(intake.nf_xml_intake_id).catch(() => null);
                    const xia2 = xml2?.resultado_ia || {};
                    nfData2 = getNFDateIntake(xml2) || String(xia2.dhEmi || xia2.dEmi || xia2.dataEmissao || xia2.data_emissao_nf || '').trim();
                  }
                  if (!nfData2) {
                    toast.error('Aprovação bloqueada: informe a data de emissão da NF em Revisar.');
                    if (onReview) onReview({ ...intake });
                    return;
                  }
                  const fileName2 = intake.file_name_final || intake.file_name_original || 'Arquivo';
"""
          if old not in s: raise SystemExit('confirm without XML block not found')
          s=s.replace(old,new,1)
          s=s.replace("nf_numero: ia2.nf_numero || '', nf_data_emissao: ia2.nf_data_emissao || ia2.data_emissao || ''", "nf_numero: ia2.nf_numero || '', nf_data_emissao: nfData2", 1)

          p.write_text(s)
          PY

          npm ci
          npm run build
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/components/entrada/DocumentIntakeCard.jsx
          git commit -m 'fix(entrada): restore reanalysis and approve-to-purchases actions'
          git push origin HEAD:main
