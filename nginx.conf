server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Evita 414 Request-URI Too Large em URLs/cabecalhos longos.
    client_header_buffer_size 16k;
    large_client_header_buffers 8 64k;

    # API compatibility: the browser calls the public domain directly.
    # Proxy every /api request to the Node API instead of letting the SPA
    # fallback return index.html/404.
    location /api/ {
        proxy_pass http://appgestor-api:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_connect_timeout 30s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        client_max_body_size 100m;
        proxy_request_buffering off;
    }

    # Socket.IO / Engine.IO realtime compatibility.
    # The browser connects to /ws-user-apps/socket.io/ and the API container
    # owns the actual Socket.IO server on port 3000.
    location /ws-user-apps/socket.io/ {
        proxy_pass http://appgestor-api:3000/ws-user-apps/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_connect_timeout 30s;
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
        proxy_buffering off;
        proxy_cache_bypass $http_upgrade;
    }

    # A deployed Vite build can replace hashed lazy-load chunks while a user
    # still has the previous shell open. Missing assets must be a real 404,
    # never the SPA HTML fallback (which otherwise throws a cryptic JS error).
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Always refresh the application shell after a deployment. Versioned assets
    # remain cached above, so this is both safe and fast on mobile connections.
    location = /index.html {
        try_files $uri =404;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0";
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0";
    }
}
