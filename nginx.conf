server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Evita 414 Request-URI Too Large em URLs/cabecalhos longos.
    client_header_buffer_size 16k;
    large_client_header_buffers 8 64k;

    # API compatibility: the browser calls the public domain directly.
    # Proxy every /api request to the Node API instead of letting the SPA
    # fallback return index.html/404.
    location /api/ {
        proxy_pass http://appgestor-api:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_connect_timeout 30s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        client_max_body_size 100m;
        proxy_request_buffering off;
    }

    # Socket.IO / Engine.IO realtime compatibility.
    # The browser connects to /ws-user-apps/socket.io/ and the API container
    # owns the actual Socket.IO server on port 3000.
    location /ws-user-apps/socket.io/ {
        proxy_pass http://appgestor-api:3000/ws-user-apps/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_connect_timeout 30s;
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
        proxy_buffering off;
        proxy_cache_bypass $http_upgrade;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
