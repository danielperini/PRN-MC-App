server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Socket.IO / Engine.IO realtime compatibility.
    # The browser connects to /ws-user-apps/socket.io/ and the API container
    # owns the actual Socket.IO server on port 3000.
    location /ws-user-apps/socket.io/ {
        proxy_pass http://appgestor-api:3000/ws-user-apps/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
        proxy_buffering off;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
